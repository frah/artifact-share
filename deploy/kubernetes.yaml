apiVersion: v1
kind: Secret
metadata:
  name: artifact-share
stringData:
  ADMIN_PASSWORD: replace-with-your-initial-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artifact-share
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-share
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: artifact-share
  template:
    metadata:
      labels:
        app: artifact-share
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: artifact-share
          image: your-registry/artifact-share:latest
          ports:
            - containerPort: 8080
          env:
            - name: BASE_PATH
              value: /artifacts
            - name: COOKIE_SECURE
              value: "true"
          envFrom:
            - secretRef:
                name: artifact-share
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: artifact-share
---
apiVersion: v1
kind: Service
metadata:
  name: artifact-share
spec:
  selector:
    app: artifact-share
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: artifact-share
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/REPLACE
spec:
  ingressClassName: alb
  rules:
    - host: artifacts.internal.example.com
      http:
        paths:
          - path: /artifacts
            pathType: Prefix
            backend:
              service:
                name: artifact-share
                port:
                  number: 80
